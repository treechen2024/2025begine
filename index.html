<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXT 轉 PPT 工具</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 PptxGenJS 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.11.0/dist/pptxgen.bundle.js"></script>
</head>
<body>
    <div class="container">
        <h1>TXT 轉 PPT 工具</h1>
        
        <!-- 修改表單，移除默認提交行為 -->
        <form id="convertForm" onsubmit="return false;">
            <div class="form-group">
                <label for="txtFile">輸入 TXT 檔案：</label>
                <input type="file" id="txtFile" name="txtFile" accept=".txt" required>
            </div>
            
            <div class="form-group">
                <label for="fontColor">字體顏色：</label>
                <input type="color" id="fontColor" name="fontColor" value="#000000">
                <span class="color-preview" id="fontColorPreview"></span>
            </div>
            
            <div class="form-group">
                <label for="bgColor">背景顏色：</label>
                <input type="color" id="bgColor" name="bgColor" value="#FFFFFF">
                <span class="color-preview" id="bgColorPreview"></span>
            </div>
            
            <div class="form-group">
                <!-- 將按鈕類型改為 button -->
                <button type="button" id="convertBtn">轉換</button>
            </div>
        </form>
        
        <div id="result" class="hidden">
            <h2>轉換完成</h2>
            <p>您的 PPT 檔案已準備好下載</p>
            <a id="downloadLink" href="#" class="download-btn">下載 PPT</a>
        </div>
        
        <div class="instructions">
            <h3>TXT 檔案格式說明</h3>
            <ul>
                <li>使用兩個以上空白行分隔不同投影片</li>
                <li>使用 /N 在同一張投影片中換行</li>
                <li>請確保 TXT 檔案使用 UTF-8 編碼</li>
            </ul>
        </div>
        
        <footer>
            <p>此工具在瀏覽器中運行，您的檔案不會上傳到任何伺服器</p>
            <p><a href="https://github.com/treechen2024/2025begine/txt-to-ppt" target="_blank">查看原始碼</a></p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
